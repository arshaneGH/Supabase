<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音響器材租賃暨報價管理平台</title>
<style>
:root{--bg:#eef2f1;--cd:#fff;--tx:#18262b;--mu:#62757b;--bd:#d6dfdd;--ac:#0f766e;--ax:#fff;--ok:#15803d;--wn:#b45309;--er:#b91c1c;--hd:#18262b;--hx:#e8f1ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1719;--cd:#172226;--tx:#e6eeee;--mu:#8da1a6;--bd:#2a3a3f;--ac:#2dd4bf;--ax:#06201d;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--hd:#0a1113;--hx:#dbe9e6}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1719;--cd:#172226;--tx:#e6eeee;--mu:#8da1a6;--bd:#2a3a3f;--ac:#2dd4bf;--ax:#06201d;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--hd:#0a1113;--hx:#dbe9e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--hd);color:var(--hx);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px}
header b{font-size:17px}.sp{flex:1}
nav{display:flex;gap:6px;flex-wrap:wrap;max-width:1040px;margin:14px auto 0;padding:0 16px}
nav button.on{background:var(--ac);color:var(--ax);border-color:var(--ac)}
main{max-width:1040px;margin:0 auto;padding:6px 16px 60px}
h2{font-size:20px;margin:18px 0 10px}h3{font-size:16px;margin:0 0 8px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:14px;margin:12px 0;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{color:var(--mu);font-weight:500;font-size:13px}.r{text-align:right;white-space:nowrap}.mu{color:var(--mu);font-size:13px}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:6px;padding:5px 11px;cursor:pointer}
button.pr{background:var(--ac);color:var(--ax);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
input[type=number]{width:96px}
.bd{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}.ac{color:var(--ac)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0}
.kpi{flex:1;min-width:150px;border:1px solid var(--bd);border-radius:8px;padding:10px 14px;background:var(--cd)}.kpi b{display:block;font-size:22px}
.log{font-size:13px;border-bottom:1px solid var(--bd);padding:6px 0;word-break:break-all}
.tot{font-size:20px;font-weight:700}
.login{max-width:380px;margin:60px auto}.login input{width:100%;margin:6px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--hd);color:var(--hx);padding:10px 16px;border-radius:8px;max-width:90vw;display:none;z-index:9}
</style></head><body>
<header><b>音響器材租賃暨報價管理平台</b><span class="sp"></span><span id="who" class="mu"></span><button id="out" style="display:none" onclick="logout()">登出</button></header>
<nav id="nav"></nav><main id="app"></main><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== 設定：換成你的 Supabase 專案（Project Settings → API）。anon key 本來就是公開的，安全性由資料庫 RLS 負責 ======
const CFG={url:'https://hlpwvgcnajyawjctjdel.supabase.co',key:'sb_publishable_n8Z3n8H4ZxkTu3zynQLQHQ_kchkEbkb'};

const RL={member:'會員',sales:'銷售窗口',owner:'老闆',super_admin:'最高管理者'};
const ST={submitted:['已送出','wn'],processing:['銷售處理中','ac'],formal:['正式報價','ok'],ordered:['已成訂單','ok'],cancelled:['已取消','er'],expired:['已過期','er']};
const ERR={STOCK_SHORT:'庫存不足',PRICE_BELOW_STANDARD:'客製價不可低於標準售價',NOT_ALLOWED:'沒有權限執行此動作',QUOTE_EXPIRED:'正式報價已過期',QUOTE_NOT_OPEN:'這張需求已被其他銷售承接',NO_ITEMS:'請至少選擇一項器材',CUSTOMER_REQUIRED:'請選擇客戶'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>'NT$'+Math.round(+n||0).toLocaleString('zh-TW'),p2=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const badge=s=>`<span class="bd ${ST[s][1]}">${ST[s][0]}</span>`;
const typ=q=>q.type=='rental'?'器材租借':'活動演出';
let tt;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',5000)}
const errMsg=m=>{const k=Object.keys(ERR).find(k=>String(m).includes(k));return k?ERR[k]+(k=='STOCK_SHORT'?'：'+String(m).split('STOCK_SHORT:')[1]:''):m};
async function run(p){const r=await p;if(r.error){toast(errMsg(r.error.message));throw r.error}return r.data}
async function act(fn){try{await fn()}catch(e){console.error(e)}}

let sb,S={user:null,p:null,view:'',eq:[],fees:[],hol:{},av:{},Q:[],B:newB(),SE:null,members:[],isc:{}};
function newB(){return{type:'rental',s:'',e:'',sess:1,it:{},fe:{},from:'',cust:''}}
const price=e=>Array.isArray(e.equipment_prices)?e.equipment_prices[0]:e.equipment_prices;

// ---------- 登入 ----------
async function boot(){
  if(CFG.url.includes('YOUR-PROJECT')){$('app').innerHTML='<div class="card">請先編輯 index.html 最上方的 CFG，填入 Supabase 專案網址與 anon key。</div>';return}
  sb=supabase.createClient(CFG.url,CFG.key);
  const{data:{session}}=await sb.auth.getSession();await setSession(session);
  sb.auth.onAuthStateChange((_e,s)=>{if((s?.user?.id||null)!==(S.user?.id||null))setSession(s)});
}
async function setSession(s){
  S.user=s?.user||null;
  if(!S.user){S.p=null;$('out').style.display='none';$('who').textContent='';$('nav').innerHTML='';return renderLogin()}
  const{data}=await sb.from('profiles').select('*').eq('id',S.user.id).single();S.p=data;
  $('who').textContent=(S.p?.name||S.user.email)+'（'+RL[S.p?.role]+'）';$('out').style.display='';
  await act(loadCatalog);go(tabs()[0][0]);
}
function renderLogin(){$('app').innerHTML=`<div class="card login"><h3>登入或註冊</h3><input id="lg_n" placeholder="姓名（註冊時填寫）"><input id="lg_e" type="email" placeholder="Email"><input id="lg_p" type="password" placeholder="密碼（至少 6 碼）"><div class="row"><button class="pr" onclick="login()">登入</button><button onclick="signup()">註冊為會員</button></div></div>`}
async function login(){await act(async()=>{await run(sb.auth.signInWithPassword({email:$('lg_e').value,password:$('lg_p').value}))})}
async function signup(){await act(async()=>{const d=await run(sb.auth.signUp({email:$('lg_e').value,password:$('lg_p').value,options:{data:{name:$('lg_n').value}}}));if(!d.session)toast('註冊成功，請到信箱完成驗證後再登入')})}
async function logout(){await sb.auth.signOut()}

async function loadCatalog(){
  S.eq=await run(sb.from('equipment').select('id,name,total_quantity,equipment_prices(weekday_price,holiday_price,session_price)').eq('is_active',true).order('name'));
  S.fees=await run(sb.from('extra_fee_types').select('*').eq('is_active',true).order('name'));
  S.hol={};(await run(sb.from('holidays').select('*'))).forEach(h=>S.hol[h.holiday_date]=h.is_holiday);
}

// ---------- 導覽 ----------
function tabs(){const r=S.p?.role;
  if(r=='member')return[['mine','我的報價'],['new','新增報價'],['profile','我的資料']];
  if(r=='sales')return[['cases','案件'],['new','替客戶報價'],['profile','我的資料']];
  const t=[['profit','營運與利潤'],['cases','全部案件'],['prices','價格與成本'],['audit','稽核紀錄']];
  if(r=='super_admin')t.push(['users','帳號與角色']);return t.concat([['profile','我的資料']])}
async function go(v){S.view=v;$('nav').innerHTML=tabs().map(([k,l])=>`<button class="${k==v?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  await act(async()=>{
    if(v=='mine'||v=='cases')await loadQuotes();
    if(v=='new'&&S.p.role=='sales')S.members=await run(sb.from('profiles').select('id,name,company_name').eq('role','member').order('name'));
    if(v=='profit'){S.profit=await run(sb.from('v_quote_profit').select('*'));await loadQuotes()}
    if(v=='prices'){S.sc=Object.fromEntries((await run(sb.from('equipment_sales_cost').select('*'))).map(x=>[x.equipment_id,x.sales_cost]));S.rc=Object.fromEntries((await run(sb.from('equipment_real_cost').select('*'))).map(x=>[x.equipment_id,x.real_cost]))}
    if(v=='audit')S.audit=await run(sb.from('audit_logs').select('*').order('id',{ascending:false}).limit(100));
    if(v=='users')S.users=await run(sb.from('profiles').select('*').order('created_at'));
    render()});}
async function loadQuotes(){
  S.Q=await run(sb.from('quotes').select('*,customer:profiles!quotes_customer_id_fkey(name,company_name),sales:profiles!quotes_assigned_sales_id_fkey(name),quote_items(*),quote_fees(*)').order('created_at',{ascending:false}));
  S.isc={};if(S.p.role!='member'){(await run(sb.from('quote_item_sales_cost').select('*'))).forEach(x=>S.isc[x.item_id]=x.sales_cost)}}
function render(){const v=S.view,f={mine:vMine,cases:vCases,new:vNew,profile:vProfile,profit:vProfit,prices:vPrices,audit:vAudit,users:vUsers}[v];$('app').innerHTML=f?f():''}

// ---------- 計價（僅用於預覽；正式金額由資料庫計算）----------
function days(s,e){if(!s||!e||s>e)return[];const r=[];for(let d=new Date(s+'T00:00:00');fmt(d)<=e&&r.length<61;d.setDate(d.getDate()+1))r.push(fmt(d));return r}
const isH=d=>d in S.hol?S.hol[d]:[0,6].includes(new Date(d+'T00:00:00').getDay());
function previewTotal(){const B=S.B,ds=days(B.s,B.e);let t=0;
  S.eq.forEach(e=>{const q=+B.it[e.id]||0;if(!q)return;const p=price(e);t+=B.type=='rental'?ds.reduce((a,d)=>a+(isH(d)?+p.holiday_price:+p.weekday_price),0)*q:p.session_price*q*(+B.sess||1)});
  S.fees.forEach(f=>t+=(+B.fe[f.id]||0)*f.default_amount);return t}

// ---------- 會員／銷售：新增報價 ----------
async function refreshAvail(){const B=S.B,ds=days(B.s,B.e);S.av={};if(!ds.length)return render();
  if(ds.length>60){toast('單張報價最長 60 天');return render()}
  await act(async()=>{await Promise.all(S.eq.map(async e=>{const d=await run(sb.rpc('check_availability',{p_equipment:e.id,p_start:B.s,p_end:B.e}));S.av[e.id]={a:Math.min(...d.map(r=>r.total_qty-r.booked)),t:Math.max(...d.map(r=>r.tentative))}}))});render()}
function vNew(){const B=S.B,ev=B.type=='event',ds=days(B.s,B.e);
  const rows=S.eq.map(e=>{const p=price(e),a=S.av[e.id];return`<tr><td>${esc(e.name)}</td><td>${ev?M(p.session_price)+' ／場':M(p.weekday_price)+' 平日 · '+M(p.holiday_price)+' 假日'}</td><td>${a?`<span class="bd ${a.a<=0?'er':a.a<3?'wn':'ok'}">可用 ${a.a}</span>`+(a.t?` <span class="mu">另有 ${a.t} 件在待確認報價中</span>`:''):'—'}</td><td><input type="number" min="0" max="99" value="${B.it[e.id]||0}" onchange="S.B.it['${e.id}']=+this.value;render()"></td></tr>`}).join('');
  const fr=S.fees.map(f=>`<tr><td>${esc(f.name)}</td><td>${M(f.default_amount)}</td><td></td><td><input type="number" min="0" max="99" value="${B.fe[f.id]||0}" onchange="S.B.fe['${f.id}']=+this.value;render()"></td></tr>`).join('');
  const cu=S.p.role=='sales'?`<label>客戶 <select onchange="S.B.cust=this.value"><option value="">請選擇</option>${S.members.map(m=>`<option value="${m.id}"${B.cust==m.id?' selected':''}>${esc(m.company_name||m.name)}</option>`).join('')}</select></label>`:'';
  return`<h2>新增報價${B.from?'（複製自舊單，價格已改用目前價格）':''}</h2><div class="card"><div class="row">${cu}<label>類型 <select onchange="S.B.type=this.value;render()"><option value="rental"${!ev?' selected':''}>器材租借（按日）</option><option value="event"${ev?' selected':''}>活動演出（按場次）</option></select></label>
<label>開始 <input type="date" value="${B.s}" onchange="S.B.s=this.value;if(!S.B.e||S.B.e<S.B.s)S.B.e=S.B.s;refreshAvail()"></label><label>結束 <input type="date" value="${B.e}" onchange="S.B.e=this.value;refreshAvail()"></label>
${ev?`<label>場次 <input type="number" min="1" value="${B.sess}" onchange="S.B.sess=+this.value||1;render()" style="width:70px"></label>`:`<span class="mu">${ds.length?`共 ${ds.length} 天，含假日 ${ds.filter(isH).length} 天`:'請先選擇日期，才會檢查庫存'}</span>`}</div>
<table><tr><th>器材</th><th>公開價格</th><th>該期間庫存</th><th>數量</th></tr>${rows}<tr><th colspan="4">附加費用</th></tr>${fr}</table>
<div class="row"><span class="tot">初步報價 ${M(previewTotal())}</span><span class="mu">實際金額以送出後系統計算為準</span><span class="sp"></span><button class="pr" id="sub" onclick="submitQ()">送出報價需求</button></div></div>`}
async function submitQ(){const B=S.B;if(!days(B.s,B.e).length)return toast('請填寫正確的日期區間');
  const items=S.eq.filter(e=>B.it[e.id]>0).map(e=>({equipment_id:e.id,quantity:+B.it[e.id]})),fees=S.fees.filter(f=>B.fe[f.id]>0).map(f=>({fee_type_id:f.id,quantity:+B.fe[f.id]}));
  $('sub').disabled=true;
  await act(async()=>{await run(sb.rpc('rpc_create_quote',{p_type:B.type,p_start:B.s,p_end:B.e,p_session_count:+B.sess||1,p_items:items,p_fees:fees,p_customer_id:B.cust||null,p_source:B.from||null}));
    toast('已送出');S.B=newB();S.av={};await go(S.p.role=='member'?'mine':'cases')});
  const b=$('sub');if(b)b.disabled=false}
function copyQ(id){const q=S.Q.find(x=>x.id==id),b=newB();b.type=q.type;b.sess=q.session_count;b.from=id;b.cust=q.customer_id;
  q.quote_items.forEach(i=>b.it[i.equipment_id]=i.quantity);q.quote_fees.forEach(f=>{if(f.fee_type_id)b.fe[f.fee_type_id]=f.quantity});S.B=b;S.av={};toast('已複製器材與數量，請重新填寫日期');go('new')}

// ---------- 報價列表 ----------
const sum=q=>q.quote_items.map(i=>esc(i.name_snapshot)+' ×'+i.quantity).join('、');
function vMine(){const rows=S.Q.map(q=>`<tr><td>${q.quote_no}</td><td>${typ(q)}</td><td>${q.start_date} ~ ${q.end_date}</td><td class="mu">${sum(q)}</td><td>${badge(q.status)}${q.status=='formal'&&q.valid_until?`<div class="mu">有效至 ${q.valid_until}</div>`:''}</td><td class="r">${M(q.total)}</td><td class="r">${q.status=='formal'?`<button class="pr" onclick="confirmQ('${q.id}')">確認成立訂單</button> `:''}<button onclick="copyQ('${q.id}')">複製為新報價</button>${['submitted','processing','formal'].includes(q.status)?` <button onclick="cancelQ('${q.id}')">取消</button>`:''}</td></tr>`).join('');
  return`<h2>我的報價</h2><div class="card"><table><tr><th>單號</th><th>類型</th><th>日期</th><th>內容</th><th>狀態</th><th class="r">金額</th><th></th></tr>${rows||'<tr><td colspan="7" class="mu">還沒有報價。到「新增報價」建立第一張。</td></tr>'}</table></div>`}
const confirmQ=id=>act(async()=>{await run(sb.rpc('rpc_confirm_order',{p_quote:id}));toast('訂單已成立');await go('mine')});
const cancelQ=id=>confirm('確定取消這張報價？')&&act(async()=>{await run(sb.rpc('rpc_cancel_quote',{p_quote:id}));await go(S.view)});

function vCases(){const me=S.p.id,sales=S.p.role=='sales';
  const rows=S.Q.map(q=>`<tr><td>${q.quote_no}</td><td>${esc(q.customer?.company_name||q.customer?.name)}</td><td>${typ(q)}</td><td>${q.start_date} ~ ${q.end_date}</td><td>${badge(q.status)}</td><td>${esc(q.sales?.name||'')||'<span class="mu">未指派</span>'}</td><td class="r">${M(q.total)}</td><td class="r">${sales&&q.status=='submitted'?`<button class="pr" onclick="takeQ('${q.id}')">承接</button>`:sales&&q.status=='processing'&&q.assigned_sales_id==me?`<button class="pr" onclick="S.SE='${q.id}';render()">調整報價</button>`:''} ${sales?`<button onclick="copyQ('${q.id}')">複製</button>`:''}</td></tr>`).join('');
  return`<h2>案件</h2><div class="card"><table><tr><th>單號</th><th>客戶</th><th>類型</th><th>日期</th><th>狀態</th><th>負責業務</th><th class="r">金額</th><th></th></tr>${rows||'<tr><td colspan="8" class="mu">目前沒有案件。</td></tr>'}</table></div>${vEd()}`}
const takeQ=id=>act(async()=>{await run(sb.rpc('rpc_take_quote',{p_quote:id}));S.SE=id;await loadQuotes();render()});

// ---------- 銷售：調整客製價格 ----------
function vEd(){const q=S.Q.find(x=>x.id==S.SE);if(!q||q.status!='processing')return'';const ev=q.type=='event';
  const rows=q.quote_items.map(i=>{const e=S.eq.find(x=>x.id==i.equipment_id),p=e?price(e):{weekday_price:i.std_weekday,holiday_price:i.std_holiday,session_price:i.std_session},c=S.isc[i.id],inp=(f,k)=>`<input id="p_${i.id}_${f}" type="number" min="${p[k]}" value="${i[f]}">`;
    return`<tr><td>${esc(i.name_snapshot)} ×${i.quantity}</td><td>${ev?M(p.session_price):M(p.weekday_price)+' / '+M(p.holiday_price)}</td><td>${c==null?'—':M(c)}</td><td>${ev?inp('session_price','session_price'):inp('weekday_price','weekday_price')+' '+inp('holiday_price','holiday_price')}</td></tr>`}).join('');
  const v=new Date(Date.now()+7*864e5);
  return`<div class="card"><h3>調整 ${q.quote_no} 的客製價格</h3><table><tr><th>器材</th><th>標準售價</th><th>業務成本</th><th>客製價（不可低於標準售價）</th></tr>${rows}</table>
<div class="row"><span class="mu">目前金額 ${M(q.total)}</span><label>報價有效至 <input type="date" id="vu" value="${fmt(v)}"></label><span class="sp"></span><button onclick="S.SE=null;render()">關閉</button><button onclick="savePrices('${q.id}')">儲存價格</button><button class="pr" onclick="issueQ('${q.id}')">產生正式報價</button></div></div>`}
async function savePrices(id,quiet){const q=S.Q.find(x=>x.id==id),ev=q.type=='event';
  for(const i of q.quote_items){const g=f=>{const el=$('p_'+i.id+'_'+f);return el?+el.value:null};
    const a=ev?{p_session:g('session_price')}:{p_weekday:g('weekday_price'),p_holiday:g('holiday_price')};
    const ch=ev?a.p_session!=i.session_price:(a.p_weekday!=i.weekday_price||a.p_holiday!=i.holiday_price);
    if(ch)await run(sb.rpc('rpc_set_custom_price',{p_item:i.id,...a}))}
  await loadQuotes();if(!quiet){toast('價格已儲存');render()}}
const issueQ=id=>act(async()=>{await savePrices(id,true);await run(sb.rpc('rpc_issue_formal_quote',{p_quote:id,p_valid_until:$('vu').value}));toast('已產生正式報價');S.SE=null;await loadQuotes();render()});

// ---------- 老闆／最高管理者 ----------
function vProfit(){const P=S.profit,rev=P.reduce((a,x)=>a+(+x.items_total||0),0),rc=P.reduce((a,x)=>a+(+x.real_cost_total||0),0);
  const rows=P.map(x=>`<tr><td>${x.quote_no}</td><td>${badge(x.status)}</td><td class="r">${M(x.total)}</td><td class="r">${M(x.sales_cost_total)}</td><td class="r">${M(x.real_cost_total)}</td><td class="r">${M(x.items_total-x.real_cost_total)}</td></tr>`).join('');
  return`<h2>營運與利潤</h2><div class="row"><div class="kpi"><span class="mu">器材報價總額</span><b>${M(rev)}</b></div><div class="kpi"><span class="mu">實際成本</span><b>${M(rc)}</b></div><div class="kpi"><span class="mu">器材毛利</span><b>${M(rev-rc)}</b></div></div>
<div class="card"><table><tr><th>單號</th><th>狀態</th><th class="r">報價總額</th><th class="r">業務成本</th><th class="r">實際成本</th><th class="r">器材毛利</th></tr>${rows}</table></div><p class="mu">包含已取消與已過期的報價；附加費用的成本未計入。</p>`}
function vPrices(){const rows=S.eq.map(e=>{const p=price(e),i=(k,v)=>`<input id="${k}_${e.id}" type="number" min="0" value="${v??''}">`;
  return`<tr><td>${esc(e.name)}</td><td>${i('wd',p.weekday_price)} ${i('hd',p.holiday_price)} ${i('ss',p.session_price)}</td><td>${i('sc',S.sc[e.id])}</td><td>${i('rc',S.rc[e.id])}</td><td class="r"><button class="pr" onclick="saveRow('${e.id}')">儲存</button></td></tr>`}).join('');
  return`<h2>價格與成本</h2><div class="card"><table><tr><th>器材</th><th>標準售價（平日／假日／場次）</th><th>業務成本（銷售可見）</th><th>實際成本（僅老闆與最高管理者）</th><th></th></tr>${rows}</table></div><p class="mu">每次修改都會寫入稽核紀錄。</p>`}
const saveRow=id=>act(async()=>{const v=k=>+$(k+'_'+id).value;
  await run(sb.from('equipment_prices').upsert({equipment_id:id,weekday_price:v('wd'),holiday_price:v('hd'),session_price:v('ss')}));
  await run(sb.from('equipment_sales_cost').upsert({equipment_id:id,sales_cost:v('sc')}));
  await run(sb.from('equipment_real_cost').upsert({equipment_id:id,real_cost:v('rc')}));
  toast('已儲存');await loadCatalog();await go('prices')});
function vAudit(){return`<h2>稽核紀錄（最近 100 筆）</h2><div class="card">${S.audit.map(l=>`<div class="log"><span class="mu">${new Date(l.created_at).toLocaleString('zh-TW',{hour12:false})}</span> ${esc(l.action)} · ${esc(l.entity_type)} · ${esc(l.entity_id)}<div class="mu">${esc(JSON.stringify(l.old_value))} → ${esc(JSON.stringify(l.new_value))}</div></div>`).join('')||'<span class="mu">目前沒有紀錄。</span>'}</div>`}
function vUsers(){const sl=S.users.filter(u=>u.role=='sales');
  return`<h2>帳號與角色</h2><div class="card"><table><tr><th>姓名</th><th>公司</th><th>角色</th><th>負責銷售（會員）</th></tr>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.company_name)}</td><td><select onchange="setRole('${u.id}',this.value)">${Object.keys(RL).map(r=>`<option value="${r}"${u.role==r?' selected':''}>${RL[r]}</option>`).join('')}</select></td><td>${u.role=='member'?`<select onchange="assign('${u.id}',this.value)"><option value="">未指派</option>${sl.map(s=>`<option value="${s.id}"${u.owner_sales_id==s.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}</td></tr>`).join('')}</table></div>`}
const setRole=(u,r)=>act(async()=>{await run(sb.rpc('admin_set_role',{p_user:u,p_role:r}));toast('角色已更新');await go('users')});
const assign=(u,s)=>act(async()=>{await run(sb.rpc('assign_sales',{p_member:u,p_sales:s||null}));toast('已更新負責銷售')});

// ---------- 我的資料 ----------
function vProfile(){const p=S.p,f=(k,l)=>`<label>${l}<br><input id="pf_${k}" value="${esc(p[k])}" style="width:100%;max-width:360px"></label>`;
  return`<h2>我的資料</h2><div class="card"><div class="row" style="flex-direction:column;align-items:flex-start">${f('name','姓名')}${f('phone','電話')}${f('company_name','公司名稱')}${f('tax_id','統一編號')}<span class="mu">Email：${esc(S.user.email)}</span><button class="pr" onclick="saveProfile()">儲存</button></div></div>`}
const saveProfile=()=>act(async()=>{const u={};['name','phone','company_name','tax_id'].forEach(k=>u[k]=$('pf_'+k).value||null);u.name=u.name||'';
  S.p=await run(sb.from('profiles').update(u).eq('id',S.user.id).select().single());$('who').textContent=S.p.name+'（'+RL[S.p.role]+'）';toast('已儲存')});

boot();
</script></body></html>
